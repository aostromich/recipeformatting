<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; font-weight: bold; }
    input, textarea { box-sizing: border-box; width: 100%; margin-top: .35rem; padding: .5rem; font: inherit; }
    textarea { min-height: 6rem; resize: vertical; }
    #ingredients { min-height: 10rem; }
    #instructions { min-height: 16rem; }
    .row { display: flex; gap: 1rem; align-items: flex-end; }
    .row > label { flex: 1; margin-top: 1rem; }
    .row > label:first-child { margin-top: 0; }
    .buttons { display: flex; gap: .75rem; flex: 0 0 auto; }
    button { padding: .6rem 1rem; cursor: pointer; height: 2.6rem; }
    #status { margin-top: 1.5rem; font-family: monospace; white-space: pre-wrap; }
    #recipe-output { margin-top: .35rem; padding: .75rem; border: 1px solid #ccc; border-radius: 4px;
      min-height: 3rem; background: #fafafa; }
    #recipe-output:empty::before { content: "Nothing generated yet — submit the form above."; color: #888; }
  </style>
</head>
<body>
  <form id="recipe-form">
    <div class="row">
      <label>
        Title
        <input name="title" type="text">
      </label>
      <div class="buttons">
        <button type="submit" data-clear="false">Submit</button>
        <button type="submit" data-clear="true">Submit &amp; Clear</button>
      </div>
    </div>

    <div class="row">
      <label>
        Yield
        <input name="yield" type="text">
      </label>
      <label>
        Prep time
        <input name="prep_time" type="text">
      </label>
      <label>
        Total time
        <input name="total_time" type="text">
      </label>
    </div>

    <label>
      Ingredients
      <textarea name="ingredients"
        placeholder="One ingredient per line"></textarea>
    </label>

    <label>
      Instructions
      <textarea name="instructions"></textarea>
    </label>

    <div class="row">
      <label>
        Source
        <input name="source" type="text">
      </label>
      <label>
        Link
        <input name="link" type="url">
      </label>
    </div>

    <label>
      Default tags
      <input name="default_tags" type="text"
        placeholder="e.g. t_chinese, t_dessert">
    </label>

    <label>
      To serve
      <textarea name="to_serve"></textarea>
    </label>

    <div class="row">
      <label>
        Make ahead
        <textarea name="make_ahead"></textarea>
      </label>
      <label>
        Storage
        <textarea name="storage"></textarea>
      </label>
    </div>

    <label>
      Note
      <textarea name="note"></textarea>
    </label>
  </form>

  <label>Generated recipe</label>
  <div id="recipe-output"></div>

  <label>Output / log</label>
  <div id="status" role="status"></div>

  <script id="initial-recipe" type="application/json">{}</script>
  <script>
    const form = document.getElementById("recipe-form");
    const status = document.getElementById("status");
    const output = document.getElementById("recipe-output");

    // Pre-populate the form with any recipe data the server embedded above.
    (() => {
      const dataEl = document.getElementById("initial-recipe");
      let initial = {};
      try {
        initial = JSON.parse(dataEl.textContent || "{}");
      } catch (e) {
        initial = {};
      }

      Object.entries(initial).forEach(([name, value]) => {
        const field = form.elements.namedItem(name);
        if (!field || value == null) return;
        field.value = Array.isArray(value) ? value.join("\n") : value;
      });
    })();

    // Always paste plain text. This deliberately preserves Unicode characters
    // such as ½, ¼, ¾, en/em dashes, etc.; it only removes rich formatting.
    document.querySelectorAll("input, textarea").forEach(field => {
      field.addEventListener("paste", event => {
        event.preventDefault();

        const text = event.clipboardData.getData("text/plain");

        if (field instanceof HTMLInputElement) {
          const start = field.selectionStart ?? field.value.length;
          const end = field.selectionEnd ?? field.value.length;
          field.setRangeText(text, start, end, "end");
        } else {
          const start = field.selectionStart;
          const end = field.selectionEnd;
          field.setRangeText(text, start, end, "end");
        }
      });
    });

    // Copy the *rendered* recipe (bold text, bullet list, hyperlink, etc.)
    // to the clipboard as rich text, so pasting into Word/Docs/Gmail/Notes
    // keeps the formatting. Falls back to plain text if the browser
    // doesn't support rich clipboard writes.
    async function copyRenderedHtml(html, plainText) {
      try {
        const item = new ClipboardItem({
          "text/html": new Blob([html], { type: "text/html" }),
          "text/plain": new Blob([plainText], { type: "text/plain" })
        });
        await navigator.clipboard.write([item]);
        return true;
      } catch (error) {
        try {
          await navigator.clipboard.writeText(plainText);
          return true;
        } catch (fallbackError) {
          return false;
        }
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const clearAfterSubmit =
        event.submitter?.dataset.clear === "true";

      status.textContent = "Submitting...";

      try {
        const params = new URLSearchParams(new FormData(form));
        params.set("_clear", clearAfterSubmit ? "true" : "false");

        const response = await fetch("/submit", {
          method: "POST",
          body: params
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.message || "Submission failed.");
        }

        let message = result.message;

        if (typeof result.html === "string") {
          output.innerHTML = result.html;
          const copied = await copyRenderedHtml(result.html, output.innerText);
          message += copied ? " — copied to clipboard." : " (copy to clipboard failed).";
        }

        status.textContent = message;

        if (clearAfterSubmit) {
          form.reset();
        }
      } catch (error) {
        status.textContent = "Error: " + error.message;
      }
    });
  </script>
</body>
</html>
